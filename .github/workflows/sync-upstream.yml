name: Sync Upstream and Tag

on:
  schedule:
    # UTC 08:00 = Beijing 16:00, daily
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    env:
      CUSTOM_BRANCH: feat/ai-provider-cards-and-naming
      UPSTREAM_REMOTE: upstream
      TAG_SUFFIX: cpa

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CUSTOM_BRANCH }}
          fetch-depth: 0
          fetch-tags: true

      - name: Add upstream remote
        run: |
          git remote add $UPSTREAM_REMOTE https://github.com/router-for-me/Cli-Proxy-API-Management-Center.git
          git fetch $UPSTREAM_REMOTE --tags

      - name: Resolve latest upstream tag
        id: upstream
        run: |
          LATEST_UPSTREAM_TAG=$(git ls-remote --tags --refs "$UPSTREAM_REMOTE" 'v*' | awk -F/ '{print $3}' | grep -v -- "-$TAG_SUFFIX\." | sort -V | tail -n 1)
          if [ -z "$LATEST_UPSTREAM_TAG" ]; then
            echo "Failed to resolve latest upstream tag."
            exit 1
          fi

          UPSTREAM_TAG_COMMIT=$(git rev-list -n 1 "$LATEST_UPSTREAM_TAG")

          echo "tag=$LATEST_UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$UPSTREAM_TAG_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Latest upstream tag: $LATEST_UPSTREAM_TAG ($UPSTREAM_TAG_COMMIT)"

      - name: Check for new upstream release
        id: check
        run: |
          UPSTREAM_TAG="${{ steps.upstream.outputs.tag }}"
          UPSTREAM_TAG_COMMIT="${{ steps.upstream.outputs.commit }}"

          if git merge-base --is-ancestor "$UPSTREAM_TAG_COMMIT" HEAD; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Current branch already contains $UPSTREAM_TAG ($UPSTREAM_TAG_COMMIT), skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New upstream release detected: $UPSTREAM_TAG ($UPSTREAM_TAG_COMMIT)"
          fi

      - name: Merge upstream release
        if: steps.check.outputs.skip == 'false'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git merge "${{ steps.upstream.outputs.commit }}" --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue on conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-conflict',
              per_page: 1
            });
            if (existing.data.length > 0) {
              console.log('Conflict issue already exists, skipping.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Upstream release sync conflict - manual merge required',
              body: [
                `Auto-sync from latest upstream tag (${process.env.UPSTREAM_TAG}) failed due to merge conflicts.`,
                '',
                '**Steps to resolve:**',
                '```bash',
                'git fetch origin',
                'git fetch upstream --tags',
                `git checkout ${process.env.CUSTOM_BRANCH}`,
                'git pull',
                `git merge ${process.env.UPSTREAM_TAG}`,
                '# resolve conflicts manually',
                'git add .',
                'git commit',
                'git push origin HEAD',
                '```',
                '',
                'After resolving, manually trigger the **Sync Upstream and Tag** workflow or wait for the next scheduled run.',
                '',
                `Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              ].join('\n'),
              labels: ['sync-conflict']
            });

      - name: Compute next tag
        if: steps.merge.outputs.conflict == 'false' && steps.check.outputs.skip == 'false'
        id: tag
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          echo "Upstream latest tag: $UPSTREAM_TAG"

          LATEST_CPA=$(git tag --list "${UPSTREAM_TAG}-${TAG_SUFFIX}.*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_CPA" ]; then
            NEXT_NUM=1
          else
            CURRENT_NUM=$(echo "$LATEST_CPA" | grep -oE '\.[0-9]+$' | tr -d '.')
            NEXT_NUM=$((CURRENT_NUM + 1))
          fi

          NEXT_TAG="${UPSTREAM_TAG}-${TAG_SUFFIX}.${NEXT_NUM}"
          echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "Next tag: $NEXT_TAG"

      - name: Push merge and tag
        if: steps.merge.outputs.conflict == 'false' && steps.check.outputs.skip == 'false'
        run: |
          git tag ${{ steps.tag.outputs.next_tag }}
          git push origin $CUSTOM_BRANCH
          git push origin ${{ steps.tag.outputs.next_tag }}
          echo "Pushed ${{ steps.tag.outputs.next_tag }}, release workflow should trigger."
